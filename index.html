<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oval</title>
<meta name="description" content="Oval is a plain-text format for voting guides. Coming soon.">
<meta property="og:title" content="Oval">
<meta property="og:description" content="A plain-text format for voting guides. Coming soon.">
<meta property="og:url" content="https://oval.vote">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root {
  --paper: #f2f1ec;
  --ink: #17150f;
  --ink-soft: #5f5b50;
  --rule: #cfccc2;
  --mark: #c4343a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16150f;
    --ink: #ebe8df;
    --ink-soft: #9d988b;
    --rule: #37352c;
    --mark: #e2666b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16150f;
  --ink: #ebe8df;
  --ink-soft: #9d988b;
  --rule: #37352c;
  --mark: #e2666b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: "Newsreader", "Iowan Old Style", Georgia, serif;
  font-optical-sizing: auto;
  font-size: 1.125rem;
  line-height: 1.5;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
a {
  color: inherit;
  text-decoration: underline;
  text-decoration-color: var(--mark);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.18em;
}
a:hover { text-decoration-thickness: 2px; }
a:focus-visible {
  outline: 2px solid var(--mark);
  outline-offset: 3px;
  border-radius: 2px;
}

.page {
  width: 100%;
  max-width: 44rem;
  margin: 0 auto;
  padding: 2rem 1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}
@media (min-width: 40rem) {
  .page { padding: 2.5rem 2rem; }
}

main {
  flex: 1;
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 1rem;
  align-content: center;
  padding: 3rem 0;
}
@media (min-width: 40rem) {
  main { column-gap: 1.5rem; }
}

.oval {
  display: inline-block;
  position: relative;
  width: 1.6em;
  height: 0.9em;
  border: 1.5px solid var(--mark);
  border-radius: 50%;
  overflow: hidden;
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  margin-top: 0.42em;
}
.oval::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--ink);
  border-radius: 50%;
  transform: scaleX(0);
  transform-origin: 0 50%;
  transition: transform 520ms cubic-bezier(.3,.7,.2,1) 400ms;
}
.oval.filled::before { transform: scaleX(1); }
.oval.filled { border-color: var(--ink); }

h1 {
  margin: 0;
  font-size: clamp(2.5rem, 7vw, 4rem);
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -0.015em;
}
main p {
  grid-column: 2;
  max-width: 24em;
  margin: 1.25rem 0 0;
  font-size: clamp(1.25rem, 2.6vw, 1.5rem);
  line-height: 1.35;
  text-wrap: balance;
}
main p + p {
  margin-top: 0.75rem;
  font-size: 1.125rem;
  color: var(--ink-soft);
}

footer {
  padding-top: 1.25rem;
  border-top: 1px solid var(--rule);
  font-size: 1rem;
  color: var(--ink-soft);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.5rem 2rem;
}
footer p { margin: 0; }

@media (prefers-reduced-motion: reduce) {
  .oval::before { transition: none; }
}
</style>
</head>
<body>
<div class="page">
<main>
  <span class="oval filled" aria-hidden="true"></span>
  <h1>Oval</h1>
  <p>A plain-text format for voting guides.</p>
  <p>Coming soon.</p>
</main>
<footer>
  <p>Open source under the MIT license.</p>
  <p><a href="https://github.com/oval-vote">github.com/oval-vote</a></p>
</footer>
</div>
</body>
</html>
