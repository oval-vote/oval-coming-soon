<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oval</title>
    <meta
      name="description"
      content="Oval is a plain-text format for voting guides. Coming soon."
    />
    <meta property="og:title" content="Oval" />
    <meta property="og:description" content="A plain-text format for voting guides. Coming soon." />
    <meta property="og:url" content="https://oval.vote" />
    <meta property="og:image" content="https://oval.vote/brand/logo/avatar.png" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="brand/logo/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="brand/tokens/oval.css" />
    <link rel="stylesheet" href="brand/css/components.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;600&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--oval-paper);
        color: var(--oval-ink);
        font: var(--oval-size-body) / var(--oval-line-body) var(--oval-font-text);
        font-optical-sizing: auto;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        width: 100%;
        max-width: var(--oval-measure);
        margin: 0 auto;
        padding: var(--oval-space-8) max(16px, env(safe-area-inset-left)) var(--oval-space-8)
          max(16px, env(safe-area-inset-right));
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: var(--oval-space-4);
        align-content: center;
        padding: var(--oval-space-12) 0;
      }
      @media (min-width: 40rem) {
        main {
          column-gap: var(--oval-space-6);
        }
      }
      .mark {
        position: relative;
        display: inline-block;
        width: 1.75em;
        height: 1em;
        border: 0.075em solid var(--oval-mark);
        border-radius: var(--oval-radius-oval);
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        margin-top: 0.48em;
      }
      .mark::before {
        content: "";
        position: absolute;
        inset: 0.1em 0.15em;
        background: var(--oval-ink);
        border-radius: var(--oval-radius-oval);
        transform: scaleX(0);
        transform-origin: 0 50%;
        transition: transform 520ms cubic-bezier(0.3, 0.7, 0.2, 1) 400ms;
      }
      .mark.filled::before {
        transform: scaleX(1);
      }
      h1 {
        margin: 0;
        font-family: var(--oval-font-display);
        font-weight: 400;
        font-size: clamp(3rem, 8vw, var(--oval-size-display));
        line-height: var(--oval-line-tight);
        letter-spacing: var(--oval-tracking-display);
      }
      main p {
        grid-column: 2;
        max-width: 24em;
        margin: var(--oval-space-4) 0 0;
        font-size: clamp(1.25rem, 2.6vw, var(--oval-size-lead));
        line-height: 1.35;
        text-wrap: balance;
      }
      main p + p {
        margin-top: var(--oval-space-3);
        font-size: var(--oval-size-body);
        color: var(--oval-ink-soft);
      }
      footer {
        padding-top: var(--oval-space-4);
        border-top: var(--oval-rule-width) solid var(--oval-rule);
        font-family: var(--oval-font-ui);
        font-size: var(--oval-size-small);
        color: var(--oval-ink-soft);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: var(--oval-space-2) var(--oval-space-8);
      }
      footer p {
        margin: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .mark::before {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <span class="mark filled" aria-hidden="true"></span>
        <h1>Oval</h1>
        <p>A plain-text format for voting guides.</p>
        <p>Coming soon.</p>
      </main>
      <footer>
        <p>Open source under the MIT license.</p>
        <p><a class="oval-link" href="https://github.com/oval-vote">github.com/oval-vote</a></p>
      </footer>
    </div>
  </body>
</html>
